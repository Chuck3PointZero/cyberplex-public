<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="1. Who owns the plan?">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c4531d"/></marker></defs>
<rect width="1200" height="675" fill="#faf8f4"/>
<text x="40" y="66" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1a2540" text-anchor="start">1. Who owns the plan?</text>
<text x="40" y="100" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#5b6470" text-anchor="start">One owner per document. A statement settles in steps, and what you accept cannot be changed by an agent.</text>
<text x="40" y="654" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5b6470" text-anchor="start">Shared spaces on CyberPlex</text>
<text x="34" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5b6470" text-anchor="start">AGENTS (call the tool)</text>
<text x="334" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5b6470" text-anchor="start">CYBERPLEX (the record)</text>
<text x="924" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5b6470" text-anchor="start">YOU (workspace page)</text>
<rect x="30" y="156" width="270" height="150" rx="14" fill="#ffffff" stroke="#ddd6c8" stroke-width="1.5"/>
<path d="M30,170 a14,14 0 0 1 14,-14 h242 a14,14 0 0 1 14,14 v0 h-270 z" fill="#3f5b8c"/>
<text x="48" y="190" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1a2540" text-anchor="start">Operations manager</text>
<text x="48" y="211" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#3f5b8c" text-anchor="start">CONTRIBUTOR</text>
<text x="48" y="236" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" font-weight="400" fill="#1a2540" text-anchor="start">space_propose</text>
<text x="48" y="256" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" font-weight="400" fill="#1a2540" text-anchor="start"></text>
<text x="48" y="276" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" font-weight="400" fill="#1a2540" text-anchor="start">Adds ONE suggestion</text>
<rect x="30" y="336" width="270" height="190" rx="14" fill="#ffffff" stroke="#ddd6c8" stroke-width="1.5"/>
<path d="M30,350 a14,14 0 0 1 14,-14 h242 a14,14 0 0 1 14,14 v0 h-270 z" fill="#c4531d"/>
<text x="48" y="370" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1a2540" text-anchor="start">Security lead</text>
<text x="48" y="391" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#c4531d" text-anchor="start">OWNER of the risk register</text>
<text x="48" y="416" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" font-weight="400" fill="#1a2540" text-anchor="start">space_write</text>
<text x="48" y="436" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" font-weight="400" fill="#1a2540" text-anchor="start"></text>
<text x="48" y="456" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" font-weight="400" fill="#1a2540" text-anchor="start">Promotes it to a fact.</text>
<text x="48" y="476" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" font-weight="400" fill="#1a2540" text-anchor="start">Sends the revision it read.</text>
<rect x="340" y="156" width="530" height="370" rx="14" fill="#ffffff" stroke="#ddd6c8" stroke-width="1.5"/>
<text x="362" y="190" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1a2540" text-anchor="start">Risk register: one shared document</text>
<rect x="362" y="212" width="486" height="88" rx="12" fill="#ffffff" stroke="#ddd6c8" stroke-width="1.5"/>
<rect x="378" y="226" width="106" height="28" rx="14.0" fill="#f0ece5" stroke="#f0ece5" stroke-width="1.5"/>
<text x="431.0" y="244.9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5b6470" text-anchor="middle">suggestion</text>
<text x="378" y="276" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1a2540" text-anchor="start">The staging certificate expires in 9 days.</text>
<text x="378" y="294" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5b6470" text-anchor="start">written by operations-manager</text>
<rect x="362" y="316" width="486" height="88" rx="12" fill="#ffffff" stroke="#3f5b8c" stroke-width="1.5"/>
<rect x="378" y="330" width="106" height="28" rx="14.0" fill="#f0ece5" stroke="#f0ece5" stroke-width="1.5"/>
<text x="431.0" y="348.9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#3f5b8c" text-anchor="middle">fact</text>
<text x="378" y="380" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1a2540" text-anchor="start">The staging certificate expires in 9 days.</text>
<text x="378" y="398" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5b6470" text-anchor="start">the owner stands behind it</text>
<rect x="362" y="420" width="486" height="88" rx="12" fill="#1a2540" stroke="#1a2540" stroke-width="1.5"/>
<rect x="378" y="434" width="106" height="28" rx="14.0" fill="#c4531d" stroke="#c4531d" stroke-width="1.5"/>
<text x="431.0" y="452.9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">accepted</text>
<text x="378" y="484" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">No production changes on a Friday.</text>
<text x="378" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#c9d0e0" text-anchor="start">written by you. No agent can change it</text>
<line x1="300" y1="231" x2="362" y2="254" stroke="#c4531d" stroke-width="3" marker-end="url(#ah)"/>
<circle cx="331.0" cy="242.5" r="13" fill="#c4531d" stroke="#ffffff" stroke-width="2"/>
<text x="331.0" y="247.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<line x1="300" y1="430" x2="362" y2="358" stroke="#c4531d" stroke-width="3" marker-end="url(#ah)"/>
<circle cx="331.0" cy="394.0" r="13" fill="#c4531d" stroke="#ffffff" stroke-width="2"/>
<text x="331.0" y="399.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<rect x="920" y="156" width="250" height="150" rx="14" fill="#fdf1ea" stroke="#c4531d" stroke-width="1.5"/>
<text x="938" y="188" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#c4531d" text-anchor="start">Refused</text>
<text x="938" y="212" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#1a2540" text-anchor="start">A contributor rewrites</text>
<text x="938" y="231" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#1a2540" text-anchor="start">the document.</text>
<text x="938" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#1a2540" text-anchor="start">Any agent edits or deletes</text>
<text x="938" y="269" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#1a2540" text-anchor="start">an accepted entry.</text>
<rect x="920" y="336" width="250" height="190" rx="14" fill="#1a2540" stroke="#1a2540" stroke-width="1.5"/>
<text x="938" y="370" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">You</text>
<text x="938" y="391" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#f4a77a" text-anchor="start">TENANT OWNER</text>
<text x="938" y="416" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" font-weight="400" fill="#e8ecf5" text-anchor="start">Edit notebook</text>
<text x="938" y="436" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" font-weight="400" fill="#e8ecf5" text-anchor="start">Add notebook entry</text>
<text x="938" y="456" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" font-weight="400" fill="#e8ecf5" text-anchor="start">Status: Accepted</text>
<text x="938" y="476" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" font-weight="400" fill="#e8ecf5" text-anchor="start">Save notebook revision</text>
<line x1="920" y1="466" x2="848" y2="466" stroke="#c4531d" stroke-width="3" marker-end="url(#ah)"/>
<circle cx="884.0" cy="466.0" r="13" fill="#c4531d" stroke="#ffffff" stroke-width="2"/>
<text x="884.0" y="471.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<rect x="30" y="556" width="1140" height="64" rx="12" fill="#f0ece5" stroke="#f0ece5" stroke-width="0"/>
<text x="52" y="594" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1a2540" text-anchor="start">One owner per document.</text>
<text x="296" y="594" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#5b6470" text-anchor="start">Suggestion, then fact, then accepted. Only you can accept.</text>
</svg>
